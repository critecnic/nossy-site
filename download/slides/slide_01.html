<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Capa W-W</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { margin: 0; padding: 0; background: #0a0f1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div class="slide" style="display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative;">

    <!-- Background glows -->
    <div data-decor class="glow" style="width:600px; height:600px; background:#3b82f6; top:-120px; left:-100px; opacity:0.18;"></div>
    <div data-decor class="glow" style="width:500px; height:500px; background:#10b981; bottom:-150px; right:-80px; opacity:0.12;"></div>
    <div data-decor class="glow" style="width:300px; height:300px; background:#3b82f6; bottom:80px; left:50%; transform:translateX(-50%); opacity:0.08;"></div>

    <!-- Badge at top -->
    <div style="position:absolute; top:48px; left:0; right:0; display:flex; justify-content:center;">
      <span class="badge">PRÉVIA DO SITE</span>
    </div>

    <!-- Center content -->
    <div style="text-align:center; z-index:1; display:flex; flex-direction:column; align-items:center;">
      <!-- Large W-W logo text -->
      <div style="font-family:'Inter',sans-serif; font-size:120px; font-weight:900; color:#e8ecf4; letter-spacing:-4px; line-height:1;">
        W-W
      </div>
      <!-- Subtitle in blue -->
      <div style="font-family:'Inter',sans-serif; font-size:32px; font-weight:600; color:#3b82f6; margin-top:4px; letter-spacing:2px;">
        World of Work
      </div>
      <!-- Description in light gray -->
      <div style="font-family:'Inter',sans-serif; font-size:20px; font-weight:400; color:#9ca3af; margin-top:12px;">
        Plataforma Global de Empregos
      </div>
    </div>

    <!-- Footer stat-cards -->
    <div style="position:absolute; bottom:48px; left:0; right:0; display:flex; justify-content:center; gap:20px; z-index:1;">
      <div class="stat-card" style="min-width:160px;">
        <div class="num">20</div>
        <div class="label">Países</div>
      </div>
      <div class="stat-card" style="min-width:160px;">
        <div class="num">10</div>
        <div class="label">Idiomas</div>
      </div>
      <div class="stat-card" style="min-width:160px;">
        <div class="num">200+</div>
        <div class="label">Páginas</div>
      </div>
      <div class="stat-card" style="min-width:160px;">
        <div class="num" style="font-size:28px;">SEO Avançado</div>
        <div class="label">&nbsp;</div>
      </div>
    </div>

  </div>
</body>
</html>
