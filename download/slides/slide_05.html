<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Estados Unidos - Página de Vagas</title>
  <link rel="stylesheet" href="global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="m-0 p-0 overflow-hidden">
  <div class="slide flex items-stretch">

    <!-- Background glow decoration -->
    <div class="glow" style="width:500px;height:500px;background:var(--accent);top:-120px;left:-80px;" aria-hidden="true"></div>
    <div class="glow" style="width:350px;height:350px;background:var(--accent2);bottom:-100px;right:200px;opacity:0.08;" aria-hidden="true"></div>

    <!-- Left Panel — 35% -->
    <div class="flex flex-col justify-center" style="width:35%;padding:64px 48px 64px 72px;">
      <span class="badge" style="align-self:flex-start;margin-bottom:24px;">US</span>
      <div style="font-size:52px;margin-bottom:12px;line-height:1;">&#127482;&#127480;</div>
      <h1 style="font-family:var(--font-heading);font-size:var(--fs-display);font-weight:800;color:var(--primary);line-height:1.15;margin-bottom:36px;">Estados Unidos</h1>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:18px;">
        <li class="flex items-start gap-3" style="font-size:var(--fs-body);color:var(--primary);opacity:0.88;line-height:1.45;">
          <span class="material-icons" style="color:var(--accent);font-size:22px;margin-top:2px;flex-shrink:0;">check_circle</span>
          Vagas em tecnologia e negócios
        </li>
        <li class="flex items-start gap-3" style="font-size:var(--fs-body);color:var(--primary);opacity:0.88;line-height:1.45;">
          <span class="material-icons" style="color:var(--accent);font-size:22px;margin-top:2px;flex-shrink:0;">check_circle</span>
          Salários em USD
        </li>
        <li class="flex items-start gap-3" style="font-size:var(--fs-body);color:var(--primary);opacity:0.88;line-height:1.45;">
          <span class="material-icons" style="color:var(--accent);font-size:22px;margin-top:2px;flex-shrink:0;">check_circle</span>
          Mercado de trabalho maduro
        </li>
        <li class="flex items-start gap-3" style="font-size:var(--fs-body);color:var(--primary);opacity:0.88;line-height:1.45;">
          <span class="material-icons" style="color:var(--accent);font-size:22px;margin-top:2px;flex-shrink:0;">check_circle</span>
          Otimizado para buscas locais
        </li>
      </ul>
    </div>

    <!-- Right Panel — 65% image -->
    <div class="flex items-center justify-center" style="width:65%;padding:52px 72px 52px 32px;">
      <img src="../usa-desktop.png" alt="Página de vagas dos Estados Unidos" style="width:100%;height:auto;max-height:620px;object-fit:contain;">
    </div>

  </div>
</body>
</html>
