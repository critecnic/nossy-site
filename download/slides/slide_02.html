<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Página Inicial Desktop</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { margin: 0; padding: 0; background: #0a0f1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div class="slide" style="display:flex; position:relative;">

    <!-- Subtle background glow -->
    <div data-decor class="glow" style="width:500px; height:500px; background:#3b82f6; top:-100px; right:100px; opacity:0.08;"></div>

    <!-- Left column 35% -->
    <div style="width:35%; display:flex; flex-direction:column; justify-content:center; padding:0 48px 0 64px; z-index:1;">
      <span class="badge" style="margin-bottom:20px;">DESKTOP</span>
      <h1 style="font-family:'Inter',sans-serif; font-size:36px; font-weight:800; color:#e8ecf4; margin-bottom:8px; line-height:1.15;">
        Página Inicial
      </h1>
      <p style="font-family:'Inter',sans-serif; font-size:16px; font-weight:400; color:#6b7280; margin-bottom:36px;">
        Desktop — 1440px
      </p>
      <ul style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:16px;">
        <li style="display:flex; align-items:flex-start; gap:12px; font-family:'Inter',sans-serif; font-size:18px; color:#e8ecf4; line-height:1.4;">
          <span class="material-icons" style="font-size:22px; color:#3b82f6; margin-top:1px;">search</span>
          Hero com busca global
        </li>
        <li style="display:flex; align-items:flex-start; gap:12px; font-family:'Inter',sans-serif; font-size:18px; color:#e8ecf4; line-height:1.4;">
          <span class="material-icons" style="font-size:22px; color:#3b82f6; margin-top:1px;">grid_view</span>
          Grid de 20 países com bandeiras
        </li>
        <li style="display:flex; align-items:flex-start; gap:12px; font-family:'Inter',sans-serif; font-size:18px; color:#e8ecf4; line-height:1.4;">
          <span class="material-icons" style="font-size:22px; color:#3b82f6; margin-top:1px;">category</span>
          Navegação por setores
        </li>
        <li style="display:flex; align-items:flex-start; gap:12px; font-family:'Inter',sans-serif; font-size:18px; color:#e8ecf4; line-height:1.4;">
          <span class="material-icons" style="font-size:22px; color:#3b82f6; margin-top:1px;">devices</span>
          Design responsivo premium
        </li>
      </ul>
    </div>

    <!-- Right column 65% — screenshot -->
    <div style="width:65%; display:flex; align-items:center; justify-content:center; padding:48px 64px 48px 24px; z-index:1;">
      <img src="../home-desktop.png" alt="Página Inicial Desktop" style="width:100%; height:auto; max-height:624px; object-fit:contain; border-radius:8px; box-shadow:0 8px 32px rgba(0,0,0,0.4);">
    </div>

  </div>
</body>
</html>
