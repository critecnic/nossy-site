<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050810; }
  .mobile-frame {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .mobile-frame img {
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    width: 100%;
    height: 480px;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class="slide flex flex-col">
  <!-- Background glow -->
  <div class="glow" style="width:600px;height:600px;background:var(--accent);top:-200px;right:-100px;" data-decor></div>
  <div class="glow" style="width:400px;height:400px;background:var(--accent2);bottom:-150px;left:-100px;opacity:0.1;" data-decor></div>

  <!-- Header -->
  <div style="padding:56px 72px 0 72px;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
      <span class="badge">RESPONSIVO</span>
    </div>
    <h1 style="font-family:var(--font-heading);font-size:var(--fs-h1);font-weight:700;color:var(--primary);letter-spacing:-0.5px;">Versão Mobile</h1>
    <p style="font-size:var(--fs-body);color:var(--muted);margin-top:6px;">Experiência otimizada para smartphones</p>
  </div>

  <!-- Mobile screenshots grid -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:28px 72px 56px 72px;">
    <div style="display:flex;gap:28px;width:100%;max-width:1160px;">
      <!-- Home -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div class="mobile-frame" style="width:100%;">
          <img src="../home-mobile.png" alt="Home Mobile" style="width:100%;height:480px;object-fit:cover;border-radius:8px;">
        </div>
        <span style="font-size:var(--fs-body);font-weight:600;color:var(--primary);">Home</span>
      </div>
      <!-- Índia -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div class="mobile-frame" style="width:100%;">
          <img src="../india-mobile.png" alt="Índia Mobile" style="width:100%;height:480px;object-fit:cover;border-radius:8px;">
        </div>
        <span style="font-size:var(--fs-body);font-weight:600;color:var(--primary);">Índia</span>
      </div>
      <!-- Brasil -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div class="mobile-frame" style="width:100%;">
          <img src="../brazil-mobile.png" alt="Brasil Mobile" style="width:100%;height:480px;object-fit:cover;border-radius:8px;">
        </div>
        <span style="font-size:var(--fs-body);font-weight:600;color:var(--primary);">Brasil</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
