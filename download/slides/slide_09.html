<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="global.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050810; }
  .stat-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
    transition: border-color 0.3s;
  }
  .stat-card:hover {
    border-color: rgba(59,130,246,0.3);
  }
  .stat-card .num {
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
    font-family: var(--font-num);
    line-height: 1.1;
  }
  .stat-card .label {
    font-size: 15px;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 400;
    line-height: 1.3;
  }
  .feature-tag {
    display: inline-block;
    background: rgba(59,130,246,0.12);
    color: var(--accent);
    font-size: var(--fs-small);
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 8px;
    margin: 4px;
    border: 1px solid rgba(59,130,246,0.2);
  }
</style>
</head>
<body>
<div class="slide flex flex-col">
  <!-- Background glows -->
  <div class="glow" style="width:500px;height:500px;background:var(--accent);top:-180px;left:50%;transform:translateX(-50%);" data-decor></div>
  <div class="glow" style="width:300px;height:300px;background:var(--accent2);bottom:-120px;right:-80px;opacity:0.08;" data-decor></div>

  <!-- Header -->
  <div style="padding:56px 72px 0 72px;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">
      <span class="badge">TECNOLOGIA</span>
    </div>
    <h1 style="font-family:var(--font-heading);font-size:var(--fs-h1);font-weight:700;color:var(--primary);letter-spacing:-0.5px;">Infraestrutura SEO & Técnica</h1>
  </div>

  <!-- Stats Grid -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 72px 0 72px;">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:0 auto;width:100%;">
      <div class="stat-card">
        <div class="num">200+</div>
        <div class="label">URLs no Sitemap</div>
      </div>
      <div class="stat-card">
        <div class="num">20</div>
        <div class="label">Países com Metadata Única</div>
      </div>
      <div class="stat-card">
        <div class="num">180</div>
        <div class="label">Páginas Setor-País</div>
      </div>
      <div class="stat-card">
        <div class="num">30+</div>
        <div class="label">Variantes Hreflang</div>
      </div>
      <div class="stat-card">
        <div class="num">5</div>
        <div class="label">Tipos de JSON-LD</div>
      </div>
      <div class="stat-card">
        <div class="num">6</div>
        <div class="label">Robots de Busca Configurados</div>
      </div>
    </div>
  </div>

  <!-- Feature Tags -->
  <div style="padding:28px 72px 52px 72px;text-align:center;">
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;">
      <span class="feature-tag">Google Jobs</span>
      <span class="feature-tag">Sitemap Dinâmico</span>
      <span class="feature-tag">robots.ts</span>
      <span class="feature-tag">Open Graph</span>
      <span class="feature-tag">Twitter Cards</span>
      <span class="feature-tag">Breadcrumbs</span>
      <span class="feature-tag">CollectionPage</span>
      <span class="feature-tag">WebSite Schema</span>
    </div>
  </div>
</div>
</body>
</html>
